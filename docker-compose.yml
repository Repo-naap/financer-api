services:
  postgres:
    image: postgres:16-alpine
    container_name: financer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financer_db}
      POSTGRES_USER: ${POSTGRES_USER:-financer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TROQUE_SENHA_POSTGRES_AQUI}
      TZ: America/Sao_Paulo
    volumes:
      - financer_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financer} -d ${POSTGRES_DB:-financer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  financer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financer-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-financer}:${POSTGRES_PASSWORD:-TROQUE_SENHA_POSTGRES_AQUI}@postgres:5432/${POSTGRES_DB:-financer_db}
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-TROQUE_POR_CHAVE_ALEATORIA_FORTE_64_CHARS}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      BACKUP_DIR: /app/backups
      SERVE_FRONTEND: "true"
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - ./backups:/app/backups

  backup-cron:
    image: postgres:16-alpine
    container_name: financer-backup-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-financer_db}
      PGUSER: ${POSTGRES_USER:-financer}
      PGPASSWORD: ${POSTGRES_PASSWORD:-TROQUE_SENHA_POSTGRES_AQUI}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        STAMP=$$(date +%Y%m%d_%H%M%S);
        pg_dump -Fc -f /backups/financer_pg_$${STAMP}.dump && echo \"[BACKUP OK] financer_pg_$${STAMP}.dump\";
        find /backups -name 'financer_pg_*.dump' -mtime +30 -delete;
        sleep 86400;
      done"

volumes:
  financer_pgdata:
